[project]
name = "researchlens"
version = "0.1.0"
description = "Evidence-grounded retrieval over scientific literature, with the numbers to say whether it works"
readme = "README.md"
license = { text = "MIT" }
# Floor 3.11 for the typing used throughout. No ceiling: onnxruntime 1.29
# (under fastembed) ships a 3.14 wheel, verified on this machine. The container
# still pins 3.12 — a reproducible deployment wants a known-good interpreter,
# not the newest one — but there is no reason to stop anyone running 3.14.
requires-python = ">=3.11"

dependencies = [
  # MIT, and exposes per-character font size — which is what makes heading
  # detection possible without a GROBID service. PyMuPDF is faster and AGPL;
  # the licence would travel to this repository, and the point of publishing
  # it is that people can use it.
  "pdfplumber>=0.11",
  # ONNX embeddings and reranking. Small enough to keep the retrieval service
  # under the memory ceiling that lets it suspend rather than cold-boot.
  "fastembed>=0.4",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "fastapi>=0.115",
  # Required by FastAPI to accept an uploaded file. It arrives transitively
  # today, which is not the same as being depended on.
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["researchlens*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
